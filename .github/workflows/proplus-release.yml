# Builds the playable Pro+ client on every push to 'proplus', runs tests, and publishes
# TripleA-ProPlus.zip to the GitHub Release tagged 'proplus-latest' (asset replaced each run).
name: ProPlus Release
on:
  push:
    branches:
      - proplus
    # a commit that only touches documentation starts no job
    paths-ignore:
      - '**.md'
  workflow_dispatch:
permissions:
  contents: write
# a new run on the branch cancels the older one (release and autoplay included)
concurrency:
  group: proplus-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Decides whether the Windows job is needed: only when something under proplus/ci or
  # proplus/dist changed (aggiorna.ps1, avvia.bat and their tests live there), or on a manual
  # run / new branch. proplus/strategia (documentation and examples) does not count.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proplus: ${{ steps.diff.outputs.proplus }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ -z "${BEFORE}" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "proplus=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${BEFORE}" "${GITHUB_SHA}" | grep -qE '^proplus/(ci|dist)/'; then
            echo "proplus=true" >> "$GITHUB_OUTPUT"
          else
            echo "proplus=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # Tests the PowerShell auto-update logic (aggiorna.ps1) on a real Windows
  # runner: version comparison, offline fallback, download + zip validation,
  # launcher self-update staging, and a short real launch of the jar.
  powershell-tests:
    needs: changes
    if: needs.changes.outputs.proplus == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Run aggiorna.ps1 tests
        shell: pwsh
        run: ./proplus/ci/test-aggiorna.ps1

  build:
    runs-on: ubuntu-latest
    needs: powershell-tests
    # runs when the Windows tests passed or were not needed
    if: ${{ !cancelled() && (needs.powershell-tests.result == 'success' || needs.powershell-tests.result == 'skipped') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # full history: the build number in the release version is the commit count
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Download the Gradle distribution (retries)
        # the wrapper gives up after one 10 s timeout and the cache is read-only off the default
        # branch; services.gradle.org can be down (504), so the run (not the repo file) downloads
        # the same zip from Gradle's GitHub releases, where services.gradle.org redirects
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's#^distributionUrl=https\\://services\.gradle\.org/distributions/gradle-([0-9.]+)-(all|bin)\.zip#distributionUrl=https\\://github.com/gradle/gradle-distributions/releases/download/v\1/gradle-\1-\2.zip#' "$props"
          sed -i -E 's#^networkTimeout=.*#networkTimeout=60000#' "$props"
          grep -E '^(distributionUrl|networkTimeout)=' "$props"
          for i in 1 2 3 4 5; do
            ./gradlew --no-daemon --version && exit 0
            echo "tentativo $i fallito, nuovo tentativo tra $((i * 20)) s"; sleep $((i * 20))
          done
          exit 1
      - name: Run tests
        # game-core holds the engine and ProAi; ai holds the extra AIs; game-headed the client.
        run: ./gradlew --no-daemon :game-core:test :ai:test :game-headed:test :proplus-autoplay:test
      - name: Set release version
        # Same step the official release uses: writes the version into product.properties
        # (done after tests, which expect the placeholder version).
        run: |
          ./game-app/run/.build/set-game-headed-build-number
          echo "build_version=$(./gradlew -q printReleaseVersion)" | tee -a "$GITHUB_ENV"
      - name: Build client jar
        run: ./gradlew --no-daemon :game-headed:shadowJar
      - name: Package zip
        run: |
          set -euo pipefail
          jar=$(ls game-app/game-headed/build/libs/game-headed-*.jar | grep -v -- '-plain' | head -n1)
          echo "Using jar: $jar"
          build_date=$(date -u +'%Y-%m-%d %H:%M UTC')
          mkdir -p build/proplus/TripleA-ProPlus
          cd build/proplus/TripleA-ProPlus
          cp "$GITHUB_WORKSPACE/$jar" TripleA-ProPlus.jar
          cp "$GITHUB_WORKSPACE/game-app/game-headed/.triplea-root" .triplea-root
          cp "$GITHUB_WORKSPACE/proplus/dist/avvia.bat" avvia.bat
          cp "$GITHUB_WORKSPACE/proplus/dist/aggiorna.ps1" aggiorna.ps1
          # LEGGIMI.txt e build-info.txt: sostituisci i segnaposto della build.
          for tmpl in LEGGIMI.txt build-info.txt; do
            sed -e "s|@VERSION@|${build_version}|g" \
                -e "s|@COMMIT@|${GITHUB_SHA}|g" \
                -e "s|@DATE@|${build_date}|g" \
                -e "s|@REPO@|${GITHUB_REPOSITORY}|g" \
                "$GITHUB_WORKSPACE/proplus/dist/${tmpl}" > "${tmpl}"
          done
          # Windows line endings for the text files the user/launcher reads.
          # build-info.txt is left with LF: avvia.bat parses it with `for /f`,
          # which would otherwise keep a trailing CR on each value.
          sed -i 's/\r\?$/\r/' avvia.bat aggiorna.ps1 LEGGIMI.txt
          zip -9 -r ../TripleA-ProPlus.zip \
            TripleA-ProPlus.jar avvia.bat aggiorna.ps1 LEGGIMI.txt build-info.txt .triplea-root
          unzip -l ../TripleA-ProPlus.zip
      - name: Publish release proplus-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=proplus-latest
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          notes="TripleA Pro+ build ${build_version} - commit ${GITHUB_SHA} (branch proplus)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "TripleA Pro+ (latest)" --notes "$notes" --prerelease
          else
            gh release create "$tag" --title "TripleA Pro+ (latest)" --notes "$notes" \
              --prerelease --verify-tag
          fi
          gh release upload "$tag" build/proplus/TripleA-ProPlus.zip --clobber

  # AI vs AI games (proplus-autoplay.yml) on the released commit, after the release: they
  # never block or change 'proplus-latest'. Called as a reusable workflow because
  # workflow_run / workflow_dispatch need the workflow on the default branch ('main' = upstream).
  # only for commits whose message contains [autoplay], [confronto], [ablazione], [conferma], [varianza], [prova] or [prova2] (or a manual run)
  autoplay:
    needs: build
    # the LLM games read the secret ANTHROPIC_API_KEY (skipped when it is missing)
    secrets: inherit
    # needs.build.result explicitly: the default success() is false when powershell-tests was skipped
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[autoplay]') || contains(github.event.head_commit.message, '[confronto]') || contains(github.event.head_commit.message, '[ablazione]') || contains(github.event.head_commit.message, '[conferma]') || contains(github.event.head_commit.message, '[varianza]') || contains(github.event.head_commit.message, '[prova]') || contains(github.event.head_commit.message, '[prova2]')) }}
    uses: ./.github/workflows/proplus-autoplay.yml
    with:
      round: "12"
      partite: "7"
      semi: "2"
      # [confronto] in the commit message: Pro+ against the original Hard (see CLAUDE.md)
      # [ablazione]: Pro+ components off one at a time against Hard (step ABLAZIONE)
      # [conferma]: the ablation's two signals on 12 new seeds (step CONFERMA)
      # [varianza]: why results change between runs (step VARIANZA)
      # [prova]: joint operations, Pro+ nudo with and without (step PROVA DI VALORE)
      # [prova2]: the take-and-hold variant of the joint operations (step PROVA2)
      modalita: ${{ contains(github.event.head_commit.message, '[prova2]') && 'prova2' || contains(github.event.head_commit.message, '[prova]') && 'prova' || contains(github.event.head_commit.message, '[varianza]') && 'varianza' || (contains(github.event.head_commit.message, '[conferma]') && 'conferma' || (contains(github.event.head_commit.message, '[ablazione]') && 'ablazione' || (contains(github.event.head_commit.message, '[confronto]') && 'confronto' || 'normale'))) }}
