  publish1:
    needs: [prepare, play]
    # step P12: partial summary of [completa] after block 1 (the final one after all blocks)
    if: always() && needs.prepare.result == 'success' && inputs.modalita == 'completa' && needs.prepare.outputs.gruppi2 != 'none'
    runs-on: ubuntu-latest
    # [completa] of step P7: 1080 games to download, compare and zip
    timeout-minutes: 180
    # one publication at a time; a run for an older commit does not overwrite a newer one
    concurrency:
      group: proplus-autoplay-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v8
        with:
          name: autoplay-kit
          path: autoplay-kit
      - uses: actions/download-artifact@v8
        if: inputs.modalita != 'ripubblica' && inputs.modalita != 'completa'
        with:
          pattern: partita-*
          path: autoplay
          merge-multiple: true
      # [ripubblica]: the 2400 games of run 44937514617 ([completa] of step P12, commit 63033bb),
      # (downloaded one at a time: the publish jobs of that run failed downloading them all at once)
      # step P13: [completa] downloads the games of THIS run the same way (one at a time), from the
      # start: downloading them all at once failed twice above ~200 artifacts
      - name: Download the games one at a time
        if: inputs.modalita == 'ripubblica' || inputs.modalita == 'completa'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.modalita == 'ripubblica' && '44937514617' || github.run_id }}
        run: |
          set -euo pipefail
          # one download at a time with retries: download-artifact with run-id asks for all 216
          # artifacts at once and hits GitHub's secondary rate limit (run 44724639523)
          mkdir -p autoplay dl
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("partita-")) | "\(.id) \(.name)"' > artefatti.txt
          wc -l artefatti.txt
          while read -r id name; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "dl/${name}.zip"; then
                ok=1; break
              fi
              echo "retry ${name} (${attempt})"; sleep $((30 * attempt))
            done
            [ "$ok" = 1 ] || { echo "download fallito: ${name}"; exit 1; }
            unzip -q -o "dl/${name}.zip" -d autoplay
            rm "dl/${name}.zip"
            # disk: the decision diaries are ~80% of the games' size (2400 games ~14 GB);
            # every number the summary needs is in riepilogo.json
            find autoplay -type d -name diario -prune -exec rm -rf {} +
            sleep 1
          done < artefatti.txt
      - name: Comparison and zip
        env:
          HAS_LLM_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          LLM_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODALITA: ${{ inputs.modalita == 'ripubblica' && 'completa' || inputs.modalita || 'normale' }}
          # 1080 game summaries in memory (run 44643856735: out of memory with the default heap)
          JAVA_OPTS: -Xmx13g
        run: |
          set -euo pipefail
          mkdir -p autoplay
          # a game whose job left nothing still gets a folder (listed as failed)
