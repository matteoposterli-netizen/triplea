# Pro+ autoplay: AI vs AI games on WW2 Europe 1940 2nd Edition after every Pro+ release,
# in parallel, with the decision diary and a summary per game; everything in autoplay.zip,
# published to the release 'autoplay-latest' (asset replaced each run). Never touches
# 'proplus-latest'. See CLAUDE.md "Autoplay in CI".
#
# Started by "ProPlus Release" as a reusable workflow (workflow_call), after its release job.
# workflow_run and workflow_dispatch only work for workflows on the default branch ('main' =
# upstream in this fork): workflow_dispatch is kept for the day this file is there.
name: ProPlus Autoplay
on:
  workflow_call:
    inputs:
      round:
        type: string
        default: "8"
      partite:
        type: string
        default: "6"
      piani:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      round:
        description: "Round per partita"
        default: "8"
      partite:
        description: "Numero di partite (le prime N della lista: A/1, A/2, D/1, D/2, C/1, Hard)"
        default: "6"
      piani:
        description: "Opzionale, sostituisce la lista: es. 'A/1,B/2,hard' (Asse/Alleati, 'hard' = Hard vs Hard)"
        default: ""
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      sha: ${{ steps.sha.outputs.sha }}
      round: ${{ steps.matrix.outputs.round }}
    steps:
      - id: sha
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build the autoplay runner
        run: ./gradlew --no-daemon :proplus-autoplay:installDist
      - name: Download the map (triplea-maps/world_war_ii_europe)
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/triplea-maps/world_war_ii_europe.git map-repo
          mkdir -p autoplay-kit
          cp map-repo/map/games/ww2eur40_2nd_edition.xml autoplay-kit/
          cp -r game-app/proplus-autoplay/build/install/proplus-autoplay autoplay-kit/runner
      - name: Games to play
        id: matrix
        env:
          ROUND: ${{ inputs.round || '8' }}
          PARTITE: ${{ inputs.partite || '6' }}
          PIANI: ${{ inputs.piani || '' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re
          rounds = int(os.environ["ROUND"])
          default = ["A/1", "A/2", "D/1", "D/2", "C/1", "hard"]
          custom = [p.strip() for p in os.environ["PIANI"].split(",") if p.strip()]
          games = custom or default[: max(1, min(6, int(os.environ["PARTITE"])))]
          include = []
          for i, g in enumerate(games, 1):
              if g.lower() == "hard":
                  include.append({"id": f"{i}-Hard-vs-Hard", "nome": "Hard vs Hard",
                                  "tipo": "Axis=hard,Allies=hard", "piano": "", "seme": i})
              else:
                  axis, allies = g.split("/")
                  include.append({"id": f"{i}-Asse-{axis}-Alleati-{allies}",
                                  "nome": f"Asse {axis} / Alleati {allies}",
                                  "tipo": "Axis=proplus,Allies=proplus",
                                  "piano": f"Axis={axis},Allies={allies}", "seme": i})
          print("matrix=" + json.dumps({"include": include}))
          print(f"round={rounds}")
          EOF
          cat "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: autoplay-kit
          path: autoplay-kit
          retention-days: 3

  play:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: play (${{ matrix.id }})
    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v8
        with:
          name: autoplay-kit
          path: autoplay-kit
      - name: Play
        run: |
          set -uo pipefail
          chmod +x autoplay-kit/runner/bin/proplus-autoplay
          out="partite/${{ matrix.id }}"
          mkdir -p "$out"
          args=(--mappa autoplay-kit/ww2eur40_2nd_edition.xml
                --round "${{ needs.prepare.outputs.round }}"
                --tipo "${{ matrix.tipo }}"
                --rischio "Axis=Equilibrato,Allies=Equilibrato"
                --seme "${{ matrix.seme }}"
                --output "$out" --nome "${{ matrix.nome }}" --minuti 52)
          if [ -n "${{ matrix.piano }}" ]; then args+=(--piano "${{ matrix.piano }}"); fi
          start=$(date +%s)
          autoplay-kit/runner/bin/proplus-autoplay "${args[@]}" 2>&1 | tee "$out/partita.log" \
            | { grep --line-buffered -E "AUTOPLAY|ERROR" || true; }
          code=${PIPESTATUS[0]}
          echo "durata job partita: $(( $(date +%s) - start )) s, uscita $code"
          gzip -f "$out/partita.log"
          test -f "$out/riepilogo.md" && cat "$out/riepilogo.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: partita-${{ matrix.id }}
          path: partite
          retention-days: 7

  publish:
    needs: [prepare, play]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # one publication at a time; a run for an older commit does not overwrite a newer one
    concurrency:
      group: proplus-autoplay-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v8
        with:
          name: autoplay-kit
          path: autoplay-kit
      - uses: actions/download-artifact@v8
        with:
          pattern: partita-*
          path: autoplay
          merge-multiple: true
      - name: Comparison and zip
        env:
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          set -euo pipefail
          mkdir -p autoplay
          # a game whose job left nothing still gets a folder (listed as failed)
          python3 -c "import json,os; [os.makedirs('autoplay/'+g['id'], exist_ok=True) for g in json.loads(os.environ['MATRIX'])['include']]"
          chmod +x autoplay-kit/runner/bin/proplus-autoplay
          sha="${{ needs.prepare.outputs.sha }}"
          title="Autoplay Pro+ - commit ${sha:0:7} - $(date -u +'%Y-%m-%d %H:%M UTC')"
          autoplay-kit/runner/bin/proplus-autoplay confronto autoplay --titolo "$title"
          cat autoplay/riepilogo-generale.md >> "$GITHUB_STEP_SUMMARY"
          (cd autoplay && zip -q -9 -r ../autoplay.zip .)
          ls -la autoplay.zip
      - name: Publish release autoplay-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=autoplay-latest
          sha="${{ needs.prepare.outputs.sha }}"
          git fetch -q --depth 200 origin proplus || true
          head=$(git rev-parse -q --verify FETCH_HEAD || true)
          if [ -n "$head" ] && [ "$head" != "$sha" ] \
             && git merge-base --is-ancestor "$sha" "$head" 2>/dev/null; then
            echo "proplus is already at a newer commit ($head): its own autoplay publishes"
            exit 0
          fi
          notes="Partite automatiche AI vs AI (Pro+ / Hard) su WW2 Europe 1940 2nd Edition.
          Commit: ${sha} (branch proplus)
          Data: $(date -u +'%Y-%m-%d %H:%M UTC')
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Contenuto di autoplay.zip: riepilogo-generale.md + una cartella per partita (riepilogo.md, riepilogo.json, diario, partita.log.gz)."
          # the tag follows the tested commit: recreate release and tag (never proplus-latest)
          gh release delete "$tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$tag" autoplay.zip --repo "$GITHUB_REPOSITORY" --target "$sha" \
            --title "Pro+ autoplay (latest)" --notes "$notes" --prerelease
