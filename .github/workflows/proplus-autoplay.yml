# Pro+ autoplay: AI vs AI games on WW2 Europe 1940 2nd Edition after every Pro+ release,
# in parallel, with the decision diary and a summary per game; everything in autoplay.zip,
# published to the release 'autoplay-latest' (asset replaced each run). Never touches
# 'proplus-latest'. See CLAUDE.md "Autoplay in CI".
#
# Started by "ProPlus Release" as a reusable workflow (workflow_call, secrets inherited), after its
# release job. With the secret ANTHROPIC_API_KEY: 4 more games with the LLM strategist (Claude Haiku)
# and the offline quality test; without it they are skipped (no error). The key is only passed as
# an environment variable to the steps that need it, never written to files or logs.
# workflow_run and workflow_dispatch only work for workflows on the default branch ('main' =
# upstream in this fork): workflow_dispatch is kept for the day this file is there.
name: ProPlus Autoplay
on:
  workflow_call:
    inputs:
      round:
        type: string
        default: "12"
      partite:
        type: string
        default: "7"
      semi:
        type: string
        default: "2"
      piani:
        type: string
        default: ""
      # "confronto" (commit with [confronto]): Pro+ against the original Hard, 7 configurations x 4 seeds
      # "ablazione" (commit with [ablazione]): Pro+ components off one at a time against Hard, rules
      # only (no LLM, no API cost), 10 configurations x 6 seeds
      # "conferma" (commit with [conferma]): Hard vs Hard, Axis Pro+ nudo, A and A without the risk
      # per front against the Allies Hard, rules only, 12 new seeds (101-112)
      # "varianza" (commit with [varianza]): Hard vs Hard and Axis Pro+ nudo on seeds 1-6 and
      # 101-106, plus Pro+ nudo on seeds 1-6 again, all in one run, rules only
      # "prova" (commit with [prova]): Pro+ nudo with and without a hand-written joint operation
      # (Egypt for the Axis, France for the Allies) against Hard, 4 configurations x 35 seeds,
      # matrix interleaved by seed, rules only
      # "prova2" (commit with [prova2]): the same 4 configurations with the "take and hold" variant
      # of the operations (step PROVA2), 35 new seeds (301-335), interleaved, rules only
      # "completa" (commit with [completa], step PARTITA COMPLETA): Hard vs Hard played until an
      # alliance wins (--fino-a-vittoria), caps 60 rounds and 120 minutes, seeds 1101-1103
      modalita:
        type: string
        default: "normale"
  workflow_dispatch:
    inputs:
      round:
        description: "Round per partita"
        default: "12"
      partite:
        description: "Numero di configurazioni (le prime N della lista: A/1, A/2, D/1, D/2, C/1, Hard, B/1)"
        default: "7"
      semi:
        description: "Semi dei dadi per configurazione (1..N): partite = configurazioni x semi"
        default: "2"
      piani:
        description: "Opzionale, sostituisce la lista: es. 'A/1,B/2,hard' (Asse/Alleati, 'hard' = Hard vs Hard)"
        default: ""
      modalita:
        description: "normale | confronto (Pro+ contro Hard, 7 configurazioni x 4 semi) | ablazione (10 configurazioni x 6 semi, solo regole) | conferma (4 configurazioni x 12 semi nuovi, solo regole) | varianza (30 partite, solo regole) | prova (operazioni congiunte, 4 configurazioni x 35 semi, solo regole) | prova2 (variante presa e tenuta, 4 configurazioni x 35 semi nuovi, solo regole) | provallm (operazioni v2 decise da Claude Sonnet, 4 configurazioni x 35 semi nuovi 401-435, tetto 40 USD) | smoke (Stratega LLM, 2 configurazioni x 6 semi 1001-1006, tetto 30 USD) | diagnosi (Stratega R0, 5 configurazioni x 10 semi 1101-1110, tetto 15 USD) | correzioni (Stratega R1, 4 configurazioni x 10 semi 1101-1110, tetto 15 USD) | ombra (Stratega R2a-bis, 2 configurazioni senza chiave x 10 semi 1101-1110, costo API 0) | impegno (Stratega R2b/R2c/R3a, 3 configurazioni x 20 semi 1121-1140, senza chiave, costo API 0) | completa (step P7: 9 configurazioni (e2, s1, s2, s5, c1-c5) x 120 semi 1621-1740 fino alla vittoria, tetti 60 round e 120 minuti, costo API 0) | prova7 (step P7: s5, c1, c2 x semi 1621-1625)"
        default: "normale"
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # step P7: the games in groups (one job each); the full list in autoplay-kit/partite.json
      gruppi: ${{ steps.matrix.outputs.gruppi }}
      sha: ${{ steps.sha.outputs.sha }}
      round: ${{ steps.matrix.outputs.round }}
    steps:
      - id: sha
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Download the Gradle distribution (retries)
        # the wrapper gives up after one 10 s timeout and the cache is read-only off the default
        # branch; services.gradle.org can be down (504), so the run (not the repo file) downloads
        # the same zip from Gradle's GitHub releases, where services.gradle.org redirects
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's#^distributionUrl=https\\://services\.gradle\.org/distributions/gradle-([0-9.]+)-(all|bin)\.zip#distributionUrl=https\\://github.com/gradle/gradle-distributions/releases/download/v\1/gradle-\1-\2.zip#' "$props"
          sed -i -E 's#^networkTimeout=.*#networkTimeout=60000#' "$props"
          grep -E '^(distributionUrl|networkTimeout)=' "$props"
          for i in 1 2 3 4 5; do
            ./gradlew --no-daemon --version && exit 0
            echo "tentativo $i fallito, nuovo tentativo tra $((i * 20)) s"; sleep $((i * 20))
          done
          exit 1
      - name: Build the autoplay runner
        run: ./gradlew --no-daemon :proplus-autoplay:installDist
      - name: Download the map (triplea-maps/world_war_ii_europe)
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/triplea-maps/world_war_ii_europe.git map-repo
          mkdir -p autoplay-kit
          cp map-repo/map/games/ww2eur40_2nd_edition.xml autoplay-kit/
          cp -r game-app/proplus-autoplay/build/install/proplus-autoplay autoplay-kit/runner
      - name: Games to play
        id: matrix
        env:
          HAS_LLM_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          ROUND: ${{ inputs.round || '12' }}
          PARTITE: ${{ inputs.partite || '7' }}
          SEMI: ${{ inputs.semi || '2' }}
          PIANI: ${{ inputs.piani || '' }}
          MODALITA: ${{ inputs.modalita || 'normale' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re
          rounds = int(os.environ["ROUND"])
          seeds = max(1, min(4, int(os.environ["SEMI"])))
          default = ["A/1", "A/2", "D/1", "D/2", "C/1", "hard", "B/1"]
          custom = [p.strip() for p in os.environ["PIANI"].split(",") if p.strip()]
          configs = custom or default[: max(1, min(7, int(os.environ["PARTITE"])))]
          if os.environ["MODALITA"] == "confronto":
              # step CONFRONTO: Pro+ (rules or Claude Haiku) on one side against the original Hard on
              # the other, same 4 seeds for every configuration, Hard vs Hard as the reference;
              # the LLM configurations only with the secret (skipped without error)
              llm = os.environ["HAS_LLM_KEY"] == "true"
              confronto = [
                  (1, "Hard-vs-Hard", "Hard vs Hard", "Axis=hard,Allies=hard", "", ""),
                  (2, "Asse-ProPlus-A-vs-Hard", "Asse Pro+ A / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", ""),
                  (3, "Asse-ProPlus-D-vs-Hard", "Asse Pro+ D / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=D", ""),
                  (4, "Hard-vs-Alleati-ProPlus-1", "Asse Hard / Alleati Pro+ 1",
                   "Axis=hard,Allies=proplus", "Allies=1", ""),
                  (5, "Hard-vs-Alleati-ProPlus-2", "Asse Hard / Alleati Pro+ 2",
                   "Axis=hard,Allies=proplus", "Allies=2", ""),
              ] + ([
                  (6, "Asse-Haiku-vs-Hard", "Asse Pro+ Haiku / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", "Axis=llm"),
                  (7, "Hard-vs-Alleati-Haiku", "Asse Hard / Alleati Pro+ Haiku",
                   "Axis=hard,Allies=proplus", "Allies=1", "Allies=llm"),
              ] if llm else [])
              include = [{"id": f"{n}-{key}-seme{seed}", "nome": f"{name} (seme {seed})",
                          "tipo": tipo, "piano": piano, "seme": seed, "decisore": decisore}
                         for (n, key, name, tipo, piano, decisore) in confronto
                         for seed in (1, 2, 3, 4)]
              print("matrix=" + json.dumps({"include": include}))
              print(f"round={rounds}")
              raise SystemExit(0)
          if os.environ["MODALITA"] in ("completa", "prova7"):
              # step PARTITA COMPLETA: games played until the victory (map triggers, held for a
              # complete round), NO key (API cost 0), caps 60 rounds and 120 minutes per game (a game
              # at a cap = "stallo", not an error). Step R6: 5 configurations x 40 seeds 1221-1260 =
              # 200 games, shuffled by seed: a Hard vs Hard, f1 Hard vs Allies strategist with the
              # commitment + "squadra_gibilterra", e2 Axis strategist with the commitment + the siege
              # (operation's share 70) vs Hard, f3 e2's Axis vs f1's Allies, g e2 with the
              # operation's share 80 (--quota-operazione) vs Hard.
              # step R6b-bis: same code as R6c, seeds 1301-1340 = 160 games: e2, h, f3, i.
              # step P1: the USA's task (switch "compiti"), seeds 1341-1380 = 160 games: a Hard vs
              # Hard, p2 Hard vs Allies with the commitment + compiti, e2 Axis with the commitment +
              # the siege (share 70) vs Hard, p1 e2's Axis vs p2's Allies
              # step P2: the alliance level (direction, shared bridgehead, the UK's task), same 4
              # configurations on new seeds 1381-1420 = 160 games
              # step P2-bis: no ban on Hard's transports, e2 and p1 on new seeds 1421-1460 = 80 games
              # (criteria and stop rule fixed beforehand: CLAUDE.md "Step P2-bis"; block p2.p2bis)
              # step P3: the UK's city held and the bridgehead weight (switch "regno_unito_p3"),
              # e2, p1, p3 on new seeds 1461-1500 = 120 games (block p3)
              # step P4: three indications to Hard (switches usa_pronti, norvegia_presto,
              # russia_fronte, independent of compiti), seeds 1501-1540 = 200 games (block p4)
              # step P5: two levers (usa_proporzione; norvegia_presto + norvegia_scorta), e2, r1-r3
              # on new seeds 1541-1580 = 160 games (block p5)
              # step P6: concentrated US landing, Norway with exposed transports, e2, s1-s4 on new
              # seeds 1581-1620 = 200 games (block p6)
              # step P7: no neutrals, the UK's bridgehead, the UK's troops ready; 9 configurations x
              # 120 new seeds 1621-1740 = 1080 games in five groups (block p7); [prova7]: s5, c1, c2
              # x seeds 1621-1625 = 15 games (the short check before the long run)
              asse = "Asse Stratega con impegno e assedio (quota 70)"
              ax = "Axis=impegno+assedio"
              base = "usa_proporzione+sbarco_concentrato"
              p7 = [
                  ("e2", "Asse-impegno-assedio-vs-Hard", "Alleati Hard", "", True),
                  ("s1", "Asse-assedio-vs-Alleati-usa-proporzione", "usa_proporzione", "usa_proporzione", False),
                  ("s2", "Asse-assedio-vs-Alleati-base", "Base", base, False),
                  ("s5", "Asse-assedio-vs-Alleati-niente-neutrali", "Base + niente_neutrali", base + "+niente_neutrali", False),
                  ("c1", "Asse-assedio-vs-Alleati-ponte-uk", "Base + ponte_uk", base + "+ponte_uk", False),
                  ("c2", "Asse-assedio-vs-Alleati-ponte-pronti", "Base + ponte_uk + ponte_pronti", base + "+ponte_uk+ponte_pronti", False),
                  ("c3", "Asse-assedio-vs-Alleati-neutrali-ponte", "Base + niente_neutrali + ponte_uk", base + "+niente_neutrali+ponte_uk", False),
                  ("c4", "Asse-assedio-vs-Alleati-neutrali-ponte-pronti", "Base + niente_neutrali + ponte_uk + ponte_pronti", base + "+niente_neutrali+ponte_uk+ponte_pronti", False),
                  ("c5", "Asse-assedio-vs-Alleati-c4-norvegia", "c4 + norvegia_presto + norvegia_esposta", base + "+niente_neutrali+ponte_uk+ponte_pronti+norvegia_presto+norvegia_esposta", False),
              ]
              if os.environ["MODALITA"] == "prova7":
                  p7 = [c for c in p7 if c[0] in ("s5", "c1", "c2")]
                  seeds = range(1621, 1626)
              else:
                  seeds = range(1621, 1741)
              completa = [
                  (n, key, asse + " / " + (label if hard else "Alleati Stratega con " + label),
                   "Axis=stratega,Allies=" + ("hard" if hard else "stratega"),
                   ax if hard else ax + ",Allies=" + allies, "")
                  for (n, key, label, allies, hard) in p7]
              include = [{"id": f"{n}-{key}-seme{seed}", "nome": f"{name} (seme {seed})",
                          "tipo": tipo, "piano": "", "seme": seed, "decisore": "",
                          "ablazione": "", "operazione": "", "opllm": "", "stratega": "",
                          "budget": "", "tetto": "70" if "stratega" in tipo else "",
                          "spento": "", "regole": "", "acceso": acceso, "completa": "si",
                          "quota": quota}
                         for (n, key, name, tipo, acceso, quota) in completa
                         for seed in seeds]
              include.sort(key=lambda g: (g["seme"], g["id"]))
              print("matrix=" + json.dumps({"include": include}))
              print("round=60")
              raise SystemExit(0)
          if os.environ["MODALITA"] == "impegno":
              # step R2b: the first campaign that ACTS (switch "impegno"); step R2c: preparation and
              # programs, seeds 1101-1120 (60 games), NO key (API cost 0): the strategist without a
              # key = Hard + the commitment. a Hard vs Hard, c1 Axis strategist with the commitment vs Hard, c2 Hard
              # vs Allies strategist with the commitment.
              impegno = [
                  ("a", "Hard-vs-Hard", "Hard vs Hard", "Axis=hard,Allies=hard", ""),
                  ("c1", "Asse-Stratega-impegno-vs-Hard",
                   "Asse Stratega con impegno / Alleati Hard", "Axis=stratega,Allies=hard",
                   "Axis=impegno"),
                  ("c2", "Hard-vs-Alleati-Stratega-impegno",
                   "Asse Hard / Alleati Stratega con impegno", "Axis=hard,Allies=stratega",
                   "Allies=impegno"),
              ]
              # step R3a: coordinated landing and theaters for the Allies, new seeds 1121-1140
              seeds = range(1121, 1141)
              include = [{"id": f"{n}-{key}-seme{seed}", "nome": f"{name} (seme {seed})",
                          "tipo": tipo, "piano": "", "seme": seed, "decisore": "",
                          "ablazione": "", "operazione": "", "opllm": "", "stratega": "",
                          "budget": "", "tetto": "70" if "stratega" in tipo else "",
                          "spento": "", "regole": "", "acceso": acceso}
                         for (n, key, name, tipo, acceso) in impegno
                         for seed in seeds]
              include.sort(key=lambda g: (g["seme"], g["id"]))
              print("matrix=" + json.dumps({"include": include}))
              print(f"round={rounds}")
              raise SystemExit(0)
          if os.environ["MODALITA"] == "ombra":
              # step R2a-bis: the shadow's two measures (diary only), same seeds as R0/R1/R2a
              # (1101-1110), NO key (API cost 0): the strategist without a key plays as Hard, so
              # the shadow measures Hard. b1 Axis strategist without a key vs Hard, b2 Hard vs
              # Allies strategist without a key. (R2a: a Hard vs Hard, c/f with the LLM.)
              ombra = [
                  ("b1", "Asse-Stratega-senza-chiave-vs-Hard",
                   "Asse Stratega senza chiave / Alleati Hard", "Axis=stratega,Allies=hard", ""),
                  ("b2", "Hard-vs-Alleati-Stratega-senza-chiave",
                   "Asse Hard / Alleati Stratega senza chiave", "Axis=hard,Allies=stratega", ""),
              ]
              seeds = range(1101, 1111)
              budget = ""
              include = [{"id": f"{n}-{key}-seme{seed}", "nome": f"{name} (seme {seed})",
                          "tipo": tipo, "piano": "", "seme": seed, "decisore": "",
                          "ablazione": "", "operazione": "", "opllm": "", "stratega": llm,
                          "budget": budget if "stratega" in tipo else "",
                          "tetto": "70" if "stratega" in tipo else "", "spento": "", "regole": ""}
                         for (n, key, name, tipo, llm) in ombra
                         for seed in seeds]
              include.sort(key=lambda g: (g["seme"], g["id"]))
              print("matrix=" + json.dumps({"include": include}))
              print(f"round={rounds}")
              raise SystemExit(0)
          if os.environ["MODALITA"] == "correzioni":
              # step R1: the corrections of group A on the same seeds as R0 (1101-1110): Hard vs
              # Hard, Axis Stratega LLM, Allies Stratega LLM, Axis rule-based baseline (no key, no
              # cost). Hard cap of the run 15 USD split over the LLM games
              correzioni = [
                  ("a", "Hard-vs-Hard", "Hard vs Hard", "Axis=hard,Allies=hard", "", ""),
                  ("c", "Asse-Stratega-LLM-vs-Hard", "Asse Stratega LLM / Alleati Hard",
                   "Axis=stratega,Allies=hard", "1", ""),
                  ("f", "Hard-vs-Alleati-Stratega-LLM", "Asse Hard / Alleati Stratega LLM",
                   "Axis=hard,Allies=stratega", "1", ""),
                  ("g", "Asse-Stratega-regole-vs-Hard", "Asse Stratega a regole / Alleati Hard",
                   "Axis=stratega,Allies=hard", "", "si"),
              ]
              seeds = range(1101, 1111)
              n_llm = sum(1 for c in correzioni if c[4]) * len(seeds)
              budget = f"{min(2.0, 15.0 / n_llm):.4f}"
              include = [{"id": f"{n}-{key}-seme{seed}", "nome": f"{name} (seme {seed})",
                          "tipo": tipo, "piano": "", "seme": seed, "decisore": "",
                          "ablazione": "", "operazione": "", "opllm": "", "stratega": llm,
                          "budget": budget if "stratega" in tipo else "",
                          "tetto": "70" if "stratega" in tipo else "", "spento": "",
                          "regole": regole}
                         for (n, key, name, tipo, llm, regole) in correzioni
                         for seed in seeds]
              include.sort(key=lambda g: (g["seme"], g["id"]))
              print("matrix=" + json.dumps({"include": include}))
              print(f"round={rounds}")
              raise SystemExit(0)
          if os.environ["MODALITA"] == "diagnosi":
              # step R0: where the Axis "Pro+ Stratega LLM" loses VC against Hard; 5 configurations
              # x 10 new seeds (1101-1110), 12 rounds, interleaved by seed. The key only goes to
              # c, d, e (b = the strategist without a key: the parachute, no operation, no list).
              # Hard cap of the run 15 USD split over the LLM games (the sum cannot pass it)
              diagnosi = [
                  ("a", "Hard-vs-Hard", "Hard vs Hard", "Axis=hard,Allies=hard", "", ""),
                  ("b", "Asse-Stratega-senza-chiave-vs-Hard",
                   "Asse Stratega senza chiave / Alleati Hard", "Axis=stratega,Allies=hard", "", ""),
                  ("c", "Asse-Stratega-LLM-vs-Hard", "Asse Stratega LLM / Alleati Hard",
                   "Axis=stratega,Allies=hard", "1", ""),
                  ("d", "Asse-Stratega-senza-liste-vs-Hard", "Asse Stratega LLM senza liste / Alleati Hard",
                   "Axis=stratega,Allies=hard", "1", "Axis=liste"),
                  ("e", "Asse-Stratega-senza-tenute-vs-Hard", "Asse Stratega LLM senza tenute / Alleati Hard",
                   "Axis=stratega,Allies=hard", "1", "Axis=tenute"),
              ]
              seeds = range(1101, 1111)
              n_llm = sum(1 for c in diagnosi if c[4]) * len(seeds)
              budget = f"{min(2.0, 15.0 / n_llm):.4f}"
              include = [{"id": f"{n}-{key}-seme{seed}", "nome": f"{name} (seme {seed})",
                          "tipo": tipo, "piano": "", "seme": seed, "decisore": "",
                          "ablazione": "", "operazione": "", "opllm": "", "stratega": llm,
                          "budget": budget if "stratega" in tipo else "",
                          "tetto": "70" if "stratega" in tipo else "", "spento": spento}
                         for (n, key, name, tipo, llm, spento) in diagnosi
                         for seed in seeds]
              include.sort(key=lambda g: (g["seme"], g["id"]))
              print("matrix=" + json.dumps({"include": include}))
              print(f"round={rounds}")
              raise SystemExit(0)
          if os.environ["MODALITA"] == "smoke":
              # step STRATEGA LLM: a check of the "Pro+ Stratega LLM" player (not a measure of
              # strength): 2 configurations x 6 new seeds (1001-1006 from step C2-bis, 901-906 C2, tetto strategia 70%; 801-806 C1-ter; 701-706 C1-bis; 601-606 COERENZA STIME; 501-506 before), 12 rounds, interleaved; the
              # strategist's cap per game is 2 USD (as for the players), at most 24 USD for the
              # 12 games, under the 30 USD cap of the run. Without the secret the games still run
              # (the strategist falls back to Hard: the parachute is what they check then)
              smoke = [
                  ("1", "Asse-Stratega-LLM-vs-Hard", "Asse Pro+ Stratega LLM / Alleati Hard",
                   "Axis=stratega,Allies=hard"),
                  ("2", "Hard-vs-Alleati-Stratega-LLM", "Asse Hard / Alleati Pro+ Stratega LLM",
                   "Axis=hard,Allies=stratega"),
              ]
              seeds = range(1001, 1007)
              budget = f"{min(2.0, 30.0 / (len(smoke) * len(seeds))):.4f}"
              include = [{"id": f"{n}-{key}-seme{seed}", "nome": f"{name} (seme {seed})",
                          "tipo": tipo, "piano": "", "seme": seed, "decisore": "",
                          "ablazione": "", "operazione": "", "opllm": "", "stratega": "1",
                          "budget": budget, "tetto": "70"}
                         for (n, key, name, tipo) in smoke
                         for seed in seeds]
              include.sort(key=lambda g: (g["seme"], g["id"]))
              print("matrix=" + json.dumps({"include": include}))
              print(f"round={rounds}")
              raise SystemExit(0)
          if os.environ["MODALITA"] == "provallm":
              # step PROVALLM: Pro+ nudo with and without the joint operation v2 whose decision
              # points are taken by an LLM (Claude Sonnet 5.5), 35 new seeds (401-435), interleaved;
              # the LLM games only with the secret; hard cap of the run 40 USD split per game
              llm = os.environ["HAS_LLM_KEY"] == "true"
              prova = [
                  ("1", "Asse-nudo-vs-Hard", "Asse Pro+ nudo / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", "Axis=nudo", "", ""),
                  ("3", "Hard-vs-Alleati-nudo", "Asse Hard / Alleati Pro+ nudo",
                   "Axis=hard,Allies=proplus", "Allies=1", "Allies=nudo", "", ""),
              ] + ([
                  ("2", "Asse-nudo-Egitto-LLM-vs-Hard", "Asse Pro+ nudo + Egitto LLM / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", "Axis=nudo", "Axis=egitto",
                   "Axis=llm:claude-sonnet-5-5"),
                  ("4", "Hard-vs-Alleati-nudo-Francia-LLM", "Asse Hard / Alleati Pro+ nudo + Francia LLM",
                   "Axis=hard,Allies=proplus", "Allies=1", "Allies=nudo", "Allies=francia",
                   "Allies=llm:claude-sonnet-5-5"),
              ] if llm else [])
              seeds = range(401, 436)
              n_llm = sum(1 for c in prova if c[7]) * len(seeds)
              budget = f"{40.0 / n_llm:.4f}" if n_llm else ""
              include = [{"id": f"{n}-{key}-seme{seed}", "nome": f"{name} (seme {seed})",
                          "tipo": tipo, "piano": piano, "seme": seed, "decisore": "",
                          "ablazione": abl, "operazione": op, "opllm": opllm,
                          "budget": budget if opllm else ""}
                         for (n, key, name, tipo, piano, abl, op, opllm) in prova
                         for seed in seeds]
              include.sort(key=lambda g: (g["seme"], g["id"]))
              print("matrix=" + json.dumps({"include": include}))
              print(f"round={rounds}")
              raise SystemExit(0)
          if os.environ["MODALITA"] in ("prova", "prova2"):
              # step PROVA DI VALORE: Pro+ nudo with and without a hand-written joint operation, on
              # one side against Hard; 35 new seeds (201-235) for every configuration, interleaved
              # by seed in the same run, rules only (no LLM key)
              prova = [
                  ("1", "Asse-nudo-vs-Hard", "Asse Pro+ nudo / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", "Axis=nudo", ""),
                  ("2", "Asse-nudo-Egitto-vs-Hard", "Asse Pro+ nudo + Egitto / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", "Axis=nudo", "Axis=egitto"),
                  ("3", "Hard-vs-Alleati-nudo", "Asse Hard / Alleati Pro+ nudo",
                   "Axis=hard,Allies=proplus", "Allies=1", "Allies=nudo", ""),
                  ("4", "Hard-vs-Alleati-nudo-Francia", "Asse Hard / Alleati Pro+ nudo + Francia",
                   "Axis=hard,Allies=proplus", "Allies=1", "Allies=nudo", "Allies=francia"),
              ]
              include = [{"id": f"{n}-{key}-seme{seed}", "nome": f"{name} (seme {seed})",
                          "tipo": tipo, "piano": piano, "seme": seed, "decisore": "",
                          "ablazione": abl, "operazione": op}
                         for (n, key, name, tipo, piano, abl, op) in prova
                         for seed in (range(301, 336) if os.environ["MODALITA"] == "prova2"
                                      else range(201, 236))]
              include.sort(key=lambda g: (g["seme"], g["id"]))
              print("matrix=" + json.dumps({"include": include}))
              print(f"round={rounds}")
              raise SystemExit(0)
          if os.environ["MODALITA"] == "varianza":
              # step VARIANZA: why the same configuration changes from one run to the next; seeds
              # 1-6 (ablation) and 101-106 (confirmation) in the SAME run, plus a replica of Pro+
              # nudo on seeds 1-6 (id ...-r<replica>-seme<seed>), rules only (no LLM key)
              varianza = [
                  ("a", "Hard-vs-Hard", "Hard vs Hard", "Axis=hard,Allies=hard", "", "",
                   [1, 2, 3, 4, 5, 6, 101, 102, 103, 104, 105, 106], 1),
                  ("b", "Asse-ProPlus-nudo-vs-Hard", "Asse Pro+ nudo / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", "Axis=nudo",
                   [1, 2, 3, 4, 5, 6, 101, 102, 103, 104, 105, 106], 1),
                  ("c", "Asse-ProPlus-nudo-vs-Hard", "Asse Pro+ nudo / Alleati Hard (replica)",
                   "Axis=proplus,Allies=hard", "Axis=A", "Axis=nudo", [1, 2, 3, 4, 5, 6], 2),
              ]
              include = [{"id": f"{n}-{key}-r{rep}-seme{seed}", "nome": f"{name} (seme {seed})",
                          "tipo": tipo, "piano": piano, "seme": seed, "decisore": "",
                          "ablazione": abl}
                         for (n, key, name, tipo, piano, abl, seeds, rep) in varianza
                         for seed in seeds]
              # interleaved (by seed, then configuration): the configurations run side by side
              # in time, not in blocks, so a slow or different runner hits all of them alike
              include.sort(key=lambda g: (g["seme"], g["id"]))
              print("matrix=" + json.dumps({"include": include}))
              print(f"round={rounds}")
              raise SystemExit(0)
          if os.environ["MODALITA"] == "conferma":
              # step CONFERMA: the two signals of the ablation (Pro+ nudo vs Hard, risk per front)
              # on 12 seeds never used before (1-6 were the ablation's, 1-4 the comparison's),
              # rules only (no LLM key passed)
              conferma = [
                  ("a", "Hard-vs-Hard", "Hard vs Hard", "Axis=hard,Allies=hard", "", ""),
                  ("b", "Asse-ProPlus-nudo-vs-Hard", "Asse Pro+ nudo / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", "Axis=nudo"),
                  ("c", "Asse-ProPlus-A-vs-Hard", "Asse Pro+ A / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", ""),
                  ("d", "Asse-A-senza-rischio-fronte", "Asse Pro+ A senza rischio per fronte / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", "Axis=rischio_fronte"),
              ]
              include = [{"id": f"{n}-{key}-seme{seed}", "nome": f"{name} (seme {seed})",
                          "tipo": tipo, "piano": piano, "seme": seed, "decisore": "",
                          "ablazione": abl}
                         for (n, key, name, tipo, piano, abl) in conferma
                         for seed in range(101, 113)]
              print("matrix=" + json.dumps({"include": include}))
              print(f"round={rounds}")
              raise SystemExit(0)
          if os.environ["MODALITA"] == "ablazione":
              # step ABLAZIONE: one Pro+ component off at a time, against the original Hard, same 6
              # seeds for every configuration, rules only (no LLM key passed: decisore stays empty)
              ablazione = [
                  ("1", "Asse-ProPlus-A-vs-Hard", "Asse Pro+ A / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", ""),
                  ("2", "Asse-A-senza-rallentamento", "Asse Pro+ A senza RALLENTAMENTO / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", "Axis=rallentamento"),
                  ("3", "Asse-A-senza-rischio-fronte", "Asse Pro+ A senza rischio per fronte / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", "Axis=rischio_fronte"),
                  ("3b", "Asse-A-senza-flotta", "Asse Pro+ A senza bersaglio flotta British / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", "Axis=bersagli_flotta"),
                  ("4", "Asse-ProPlus-nudo-vs-Hard", "Asse Pro+ nudo / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", "Axis=nudo"),
                  ("5", "Hard-vs-Alleati-ProPlus-1", "Asse Hard / Alleati Pro+ 1",
                   "Axis=hard,Allies=proplus", "Allies=1", ""),
                  ("6a", "Alleati-1-senza-trasporti-sbarco", "Asse Hard / Alleati Pro+ 1 senza trasporti dopo lo sbarco",
                   "Axis=hard,Allies=proplus", "Allies=1", "Allies=trasporti_sbarco"),
                  ("6b", "Alleati-1-senza-soste-sicure", "Asse Hard / Alleati Pro+ 1 senza soste sicure",
                   "Axis=hard,Allies=proplus", "Allies=1", "Allies=soste_sicure"),
                  ("7", "Hard-vs-Alleati-ProPlus-nudo", "Asse Hard / Alleati Pro+ nudo",
                   "Axis=hard,Allies=proplus", "Allies=1", "Allies=nudo"),
                  ("8", "Hard-vs-Hard", "Hard vs Hard", "Axis=hard,Allies=hard", "", ""),
              ]
              include = [{"id": f"{n}-{key}-seme{seed}", "nome": f"{name} (seme {seed})",
                          "tipo": tipo, "piano": piano, "seme": seed, "decisore": "",
                          "ablazione": abl}
                         for (n, key, name, tipo, piano, abl) in ablazione
                         for seed in (1, 2, 3, 4, 5, 6)]
              print("matrix=" + json.dumps({"include": include}))
              print(f"round={rounds}")
              raise SystemExit(0)
          # every configuration with the same seeds 1..N, so the configurations are comparable
          include = []
          for i, g in enumerate(configs, 1):
              for seed in range(1, seeds + 1):
                  if g.lower() == "hard":
                      include.append({"id": f"{i}-Hard-vs-Hard-seme{seed}",
                                      "nome": f"Hard vs Hard (seme {seed})",
                                      "tipo": "Axis=hard,Allies=hard", "piano": "", "seme": seed,
                                      "decisore": ""})
                  else:
                      axis, allies = g.split("/")
                      include.append({"id": f"{i}-Asse-{axis}-Alleati-{allies}-seme{seed}",
                                      "nome": f"Asse {axis} / Alleati {allies} (seme {seed})",
                                      "tipo": "Axis=proplus,Allies=proplus",
                                      "piano": f"Axis={axis},Allies={allies}", "seme": seed,
                                      "decisore": ""})
          # LLM strategist (Claude Haiku via ANTHROPIC_API_KEY), 4 seeds each, only with the secret:
          # Allies LLM vs Axis A by rules, Axis LLM vs Allies 1 by rules (compare with A/1); plus
          # 2 games with Claude Sonnet 5.5 as the Allies' strategist (comparison of models)
          if os.environ["HAS_LLM_KEY"] == "true" and not custom:
              n = len(configs)
              for seed in (1, 2, 3, 4):
                  include.append({"id": f"{n + 1}-LLM-Alleati-vs-Asse-A-seme{seed}",
                                  "nome": f"Alleati LLM / Asse A regole (seme {seed})",
                                  "tipo": "Axis=proplus,Allies=proplus",
                                  "piano": "Axis=A,Allies=1", "seme": seed,
                                  "decisore": "Allies=llm"})
              for seed in (1, 2, 3, 4):
                  include.append({"id": f"{n + 2}-LLM-Asse-vs-Alleati-1-seme{seed}",
                                  "nome": f"Asse LLM / Alleati 1 regole (seme {seed})",
                                  "tipo": "Axis=proplus,Allies=proplus",
                                  "piano": "Axis=A,Allies=1", "seme": seed,
                                  "decisore": "Axis=llm"})
              for seed in (1, 2):
                  include.append({"id": f"{n + 3}-Sonnet-Alleati-vs-Asse-A-seme{seed}",
                                  "nome": f"Alleati Sonnet / Asse A regole (seme {seed})",
                                  "tipo": "Axis=proplus,Allies=proplus",
                                  "piano": "Axis=A,Allies=1", "seme": seed,
                                  "decisore": "Allies=llm:claude-sonnet-5-5"})
              # rules A/1 with seeds 3 and 4 too: the reference has the same 4 seeds as the LLM games
              for seed in (3, 4):
                  include.append({"id": f"1-Asse-A-Alleati-1-seme{seed}",
                                  "nome": f"Asse A / Alleati 1 (seme {seed})",
                                  "tipo": "Axis=proplus,Allies=proplus",
                                  "piano": "Axis=A,Allies=1", "seme": seed,
                                  "decisore": ""})
          print("matrix=" + json.dumps({"include": include}))
          print(f"round={rounds}")
          EOF
          # step P7: the games in groups, one job each ([completa]: 5 games of consecutive seeds,
          # 1080 games = 216 jobs, under 256 however the limit is counted; else 1 game per job)
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          m = None
          for line in open(os.environ["GITHUB_OUTPUT"]):
              if line.startswith("matrix="):
                  m = json.loads(line[len("matrix="):])
          inc = m["include"]
          json.dump(m, open("autoplay-kit/partite.json", "w"))
          size = 5 if os.environ["MODALITA"] == "completa" else 1
          groups = []
          for i in range(0, len(inc), size):
              gs = inc[i:i + size]
              gid = gs[0]["id"] if size == 1 else f"g{i // size + 1:03d}-semi{gs[0]['seme']}-{gs[-1]['seme']}"
              llm = any(g.get("decisore") or g.get("opllm") or g.get("stratega") for g in gs)
              groups.append({"id": gid, "llm": "si" if llm else "", "giochi": gs})
          assert len(groups) <= 256, "troppi job"
          print("gruppi=" + json.dumps({"include": groups}))
          EOF
          cat "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: autoplay-kit
          path: autoplay-kit
          retention-days: 3

  # step P7: every matrix entry is a group of games played one after the other ([completa]: 5
  # games per job, 1080 games = 216 jobs, under the limit of 256 jobs of a matrix whatever it
  # counts; the other modes: 1 game per job as before); groups in seed order, seeds 1621-1700 first
  play:
    needs: prepare
    runs-on: ubuntu-latest
    # [completa]: up to 5 games in one job (each at most 120 minutes, the job's budget 340)
    timeout-minutes: ${{ (inputs.modalita == 'completa' || inputs.modalita == 'prova7') && 355 || 30 }}
    strategy:
      fail-fast: false
      # [prova]: 140 games, 20 at a time (the free limit of concurrent jobs)
      max-parallel: ${{ (inputs.modalita == 'prova' || inputs.modalita == 'prova2' || inputs.modalita == 'provallm' || inputs.modalita == 'diagnosi' || inputs.modalita == 'correzioni' || inputs.modalita == 'ombra' || inputs.modalita == 'impegno' || inputs.modalita == 'completa' || inputs.modalita == 'prova7') && 20 || 6 }}
      matrix: ${{ fromJson(needs.prepare.outputs.gruppi) }}
    name: play (${{ matrix.id }})
    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v8
        with:
          name: autoplay-kit
          path: autoplay-kit
      - name: Play
        env:
          # only the groups with an LLM game get the key (strategist, or the operations' decisions)
          ANTHROPIC_API_KEY: ${{ matrix.llm == 'si' && secrets.ANTHROPIC_API_KEY || '' }}
          GIOCHI: ${{ toJson(matrix.giochi) }}
          ROUND: ${{ needs.prepare.outputs.round }}
          BUDGET: "340"
        run: |
          set -uo pipefail
          chmod +x autoplay-kit/runner/bin/proplus-autoplay
          python3 - <<'EOF'
          import gzip, json, os, shutil, subprocess, sys, time
          games = json.loads(os.environ["GIOCHI"])
          start = time.time()
          worst = 0
          opts = [("--piano", "piano"), ("--decisore", "decisore"), ("--ablazione", "ablazione"),
                  ("--operazione", "operazione"), ("--operazione-decisore", "opllm"),
                  ("--budget-operazioni", "budget"), ("--tetto-strategia", "tetto"),
                  ("--stratega-spento", "spento"), ("--stratega-regole", "regole"),
                  ("--stratega-acceso", "acceso"), ("--fino-a-vittoria", "completa"),
                  ("--quota-operazione", "quota")]
          for g in games:
              out = "partite/" + g["id"]
              os.makedirs(out, exist_ok=True)
              full = g.get("completa") == "si"
              left = float(os.environ["BUDGET"]) - (time.time() - start) / 60
              # a complete game: at most 120 minutes, less if the job's budget is ending
              minutes = int(min(120, max(5, left - 8))) if full else 25
              args = ["autoplay-kit/runner/bin/proplus-autoplay",
                      "--mappa", "autoplay-kit/ww2eur40_2nd_edition.xml",
                      "--round", os.environ["ROUND"], "--tipo", g["tipo"],
                      "--rischio", "Axis=Equilibrato,Allies=Equilibrato",
                      "--seme", str(g["seme"]), "--output", out, "--nome", g["nome"],
                      "--minuti", str(minutes)]
              for opt, key in opts:
                  if g.get(key):
                      args += [opt, str(g[key])]
              t0 = time.time()
              with open(out + "/partita.log", "wb") as log:
                  p = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  for line in p.stdout:
                      log.write(line)
                      if b"AUTOPLAY" in line or b"ERROR" in line:
                          sys.stdout.buffer.write(line)
                          sys.stdout.flush()
                  code = p.wait()
              print(f"{g['id']}: durata {int(time.time() - t0)} s, minuti {minutes}, uscita {code}", flush=True)
              with open(out + "/partita.log", "rb") as f, gzip.open(out + "/partita.log.gz", "wb") as z:
                  shutil.copyfileobj(f, z)
              os.remove(out + "/partita.log")
              if os.path.exists(out + "/riepilogo.md"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s, open(out + "/riepilogo.md") as r:
                      s.write(r.read())
              worst = max(worst, code)
          sys.exit(worst)
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: partita-${{ matrix.id }}
          path: partite
          retention-days: 7

  publish:
    needs: [prepare, play]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    # [completa] of step P7: 1080 games to download, compare and zip
    timeout-minutes: 180
    # one publication at a time; a run for an older commit does not overwrite a newer one
    concurrency:
      group: proplus-autoplay-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v8
        with:
          name: autoplay-kit
          path: autoplay-kit
      - uses: actions/download-artifact@v8
        with:
          pattern: partita-*
          path: autoplay
          merge-multiple: true
      - name: Comparison and zip
        env:
          HAS_LLM_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          LLM_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODALITA: ${{ inputs.modalita || 'normale' }}
        run: |
          set -euo pipefail
          mkdir -p autoplay
          # a game whose job left nothing still gets a folder (listed as failed)
          # step P7: the list from the kit (1080 games do not fit in an environment variable)
          python3 -c "import json,os; [os.makedirs('autoplay/'+g['id'], exist_ok=True) for g in json.load(open('autoplay-kit/partite.json'))['include']]"
          chmod +x autoplay-kit/runner/bin/proplus-autoplay
          sha="${{ needs.prepare.outputs.sha }}"
          title="Autoplay Pro+$([ "${MODALITA}" = "confronto" ] && echo ' - confronto contro Hard')$([ "${MODALITA}" = "ablazione" ] && echo ' - ablazione dei componenti')$([ "${MODALITA}" = "conferma" ] && echo ' - conferma (semi 101-112)')$([ "${MODALITA}" = "varianza" ] && echo ' - varianza tra run')$([ "${MODALITA}" = "prova" ] && echo ' - prova di valore (operazioni congiunte)')$([ "${MODALITA}" = "prova2" ] && echo ' - prova2 (presa e tenuta, semi 301-335)')$([ "${MODALITA}" = "provallm" ] && echo ' - provallm (operazioni decise da Sonnet, semi 401-435)')$([ "${MODALITA}" = "smoke" ] && echo ' - smoke Stratega LLM (semi 1001-1006)')$([ "${MODALITA}" = "diagnosi" ] && echo ' - diagnosi Stratega R0 (semi 1101-1110)')$([ "${MODALITA}" = "correzioni" ] && echo ' - correzioni Stratega R1 (semi 1101-1110)')$([ "${MODALITA}" = "ombra" ] && echo ' - ombra Stratega R2a-bis senza chiave (semi 1101-1110)')$([ "${MODALITA}" = "impegno" ] && echo ' - impegno Stratega R3a senza chiave (semi 1121-1140)')$([ "${MODALITA}" = "completa" ] && echo ' - partite complete fino alla vittoria, step P7 (semi 1621-1740)')$([ "${MODALITA}" = "prova7" ] && echo ' - prova breve dello step P7 (s5, c1, c2, semi 1621-1625)') - commit ${sha:0:7} - $(date -u +'%Y-%m-%d %H:%M UTC')"
          autoplay-kit/runner/bin/proplus-autoplay confronto autoplay --titolo "$title"
          # the step summary takes at most 1 MiB: the full text is in the zip
          head -c 900000 autoplay/riepilogo-generale.md >> "$GITHUB_STEP_SUMMARY"
          # LLM strategist: offline quality test on 30 strategic states of these games (skipped,
          # exit 0, without the secret)
          if [ "${HAS_LLM_KEY}" = "true" ] && [ "${MODALITA}" = "normale" ]; then
            ANTHROPIC_API_KEY="${LLM_KEY}" autoplay-kit/runner/bin/proplus-autoplay qualita autoplay \
              --n 30 --output autoplay/qualita || echo "test di qualita' fallito (non blocca)"
            test -f autoplay/qualita/qualita.md && cat autoplay/qualita/qualita.md >> "$GITHUB_STEP_SUMMARY"
            # turn orders (second level): inputs written by every Pro+ game with the diary
            ANTHROPIC_API_KEY="${LLM_KEY}" autoplay-kit/runner/bin/proplus-autoplay qualita autoplay \
              --n 30 --livello ordini --output autoplay/qualita-ordini \
              || echo "test di qualita' degli ordini fallito (non blocca)"
            test -f autoplay/qualita-ordini/qualita.md && cat autoplay/qualita-ordini/qualita.md >> "$GITHUB_STEP_SUMMARY"
          fi
          # strategic contract: the state/directives JSON files of the first seed only (1 game
          # per configuration), the sizes are already in each game's summary
          find autoplay -path '*-seme[2-9]*' \( -name 'stato-R*.json' -o -name 'direttive-R*.json' \
            -o -name 'ordini-ingresso-R*.json' -o -name 'ordini-R*.json' \) -delete
          (cd autoplay && zip -q -9 -r ../autoplay.zip .)
          ls -la autoplay.zip
      - name: Publish release autoplay-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=autoplay-latest
          sha="${{ needs.prepare.outputs.sha }}"
          git fetch -q --depth 200 origin proplus || true
          head=$(git rev-parse -q --verify FETCH_HEAD || true)
          if [ -n "$head" ] && [ "$head" != "$sha" ] \
             && git merge-base --is-ancestor "$sha" "$head" 2>/dev/null; then
            # newer commits with documentation only (*.md) start no run: publish this one
            if git diff --name-only "$sha" "$head" | grep -qv '\.md$'; then
              echo "proplus is already at a newer commit ($head): its own autoplay publishes"
              exit 0
            fi
            echo "proplus is at $head with documentation changes only: publishing $sha"
          fi
          notes="Partite automatiche AI vs AI (Pro+ / Hard) su WW2 Europe 1940 2nd Edition.
          Commit: ${sha} (branch proplus)
          Data: $(date -u +'%Y-%m-%d %H:%M UTC')
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Contenuto di autoplay.zip: riepilogo-generale.md + una cartella per partita (riepilogo.md, riepilogo.json, diario, partita.log.gz); JSON di stato e direttive del contratto nel diario delle partite seme 1."
          # the tag follows the tested commit: recreate release and tag (never proplus-latest)
          gh release delete "$tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$tag" autoplay.zip --repo "$GITHUB_REPOSITORY" --target "$sha" \
            --title "Pro+ autoplay (latest)" --notes "$notes" --prerelease
