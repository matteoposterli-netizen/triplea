# Pro+ autoplay: AI vs AI games on WW2 Europe 1940 2nd Edition after every Pro+ release,
# in parallel, with the decision diary and a summary per game; everything in autoplay.zip,
# published to the release 'autoplay-latest' (asset replaced each run). Never touches
# 'proplus-latest'. See CLAUDE.md "Autoplay in CI".
#
# Started by "ProPlus Release" as a reusable workflow (workflow_call, secrets inherited), after its
# release job. With the secret ANTHROPIC_API_KEY: 4 more games with the LLM strategist (Claude Haiku)
# and the offline quality test; without it they are skipped (no error). The key is only passed as
# an environment variable to the steps that need it, never written to files or logs.
# workflow_run and workflow_dispatch only work for workflows on the default branch ('main' =
# upstream in this fork): workflow_dispatch is kept for the day this file is there.
name: ProPlus Autoplay
on:
  workflow_call:
    inputs:
      round:
        type: string
        default: "12"
      partite:
        type: string
        default: "7"
      semi:
        type: string
        default: "2"
      piani:
        type: string
        default: ""
      # "confronto" (commit with [confronto]): Pro+ against the original Hard, 7 configurations x 4 seeds
      # "ablazione" (commit with [ablazione]): Pro+ components off one at a time against Hard, rules
      # only (no LLM, no API cost), 10 configurations x 6 seeds
      # "conferma" (commit with [conferma]): Hard vs Hard, Axis Pro+ nudo, A and A without the risk
      # per front against the Allies Hard, rules only, 12 new seeds (101-112)
      # "varianza" (commit with [varianza]): Hard vs Hard and Axis Pro+ nudo on seeds 1-6 and
      # 101-106, plus Pro+ nudo on seeds 1-6 again, all in one run, rules only
      # "prova" (commit with [prova]): Pro+ nudo with and without a hand-written joint operation
      # (Egypt for the Axis, France for the Allies) against Hard, 4 configurations x 35 seeds,
      # matrix interleaved by seed, rules only
      # "prova2" (commit with [prova2]): the same 4 configurations with the "take and hold" variant
      # of the operations (step PROVA2), 35 new seeds (301-335), interleaved, rules only
      # "completa" (commit with [completa], step PARTITA COMPLETA): Hard vs Hard played until an
      # alliance wins (--fino-a-vittoria), caps 60 rounds and 120 minutes, seeds 1101-1103
      modalita:
        type: string
        default: "normale"
  workflow_dispatch:
    inputs:
      round:
        description: "Round per partita"
        default: "12"
      partite:
        description: "Numero di configurazioni (le prime N della lista: A/1, A/2, D/1, D/2, C/1, Hard, B/1)"
        default: "7"
      semi:
        description: "Semi dei dadi per configurazione (1..N): partite = configurazioni x semi"
        default: "2"
      piani:
        description: "Opzionale, sostituisce la lista: es. 'A/1,B/2,hard' (Asse/Alleati, 'hard' = Hard vs Hard)"
        default: ""
      modalita:
        description: "normale | confronto (Pro+ contro Hard, 7 configurazioni x 4 semi) | ablazione (10 configurazioni x 6 semi, solo regole) | conferma (4 configurazioni x 12 semi nuovi, solo regole) | varianza (30 partite, solo regole) | prova (operazioni congiunte, 4 configurazioni x 35 semi, solo regole) | prova2 (variante presa e tenuta, 4 configurazioni x 35 semi nuovi, solo regole) | provallm (operazioni v2 decise da Claude Sonnet, 4 configurazioni x 35 semi nuovi 401-435, tetto 40 USD) | smoke (Stratega LLM, 2 configurazioni x 6 semi 1001-1006, tetto 30 USD) | diagnosi (Stratega R0, 5 configurazioni x 10 semi 1101-1110, tetto 15 USD) | correzioni (Stratega R1, 4 configurazioni x 10 semi 1101-1110, tetto 15 USD) | ombra (Stratega R2a-bis, 2 configurazioni senza chiave x 10 semi 1101-1110, costo API 0) | impegno (Stratega R2b/R2c/R3a, 3 configurazioni x 20 semi 1121-1140, senza chiave, costo API 0) | completa (step P15: 00, 10, 01, 11 x semi da 2639, tutte le nazioni Pro+ (Europe 1940) con le caselle, tetti 60 round e 120 minuti, costo API 0) | prova7 (step P7: s5, c1, c2 x semi 1621-1625) | prova9 (step P9+P10: d1 x semi 1741-1745) | prova12 (step P12: leve dell'Italia da sole e tutte insieme + solo assedio, contro Alleati Hard, semi 2101-2105) | prova13 (step P13: taranto, fabbriche_tenute, bombardamento_mosca da sole + 000, semi 2221-2225) | prova14 (step P14: aerei_corretti 00, 10, 01, 11 x semi 2347-2351) | provapv1 (step PV1: base e pv1 x semi 2472-2475) | ablazionepv1 (step PV1: A, B, C da soli x semi 2476-2515) | provap15 (step P15: 00, 10, 01, 11 x semi 2636-2638) | ripubblica (nessuna partita: confronto e zip delle partite della run 44937514617)"
        default: "normale"
permissions:
  contents: write
  # [ripubblica]: the publish job downloads the games of an earlier run
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # step P7: the games in groups (one job each); the full list in autoplay-kit/partite.json
      gruppi: ${{ steps.matrix.outputs.gruppi }}
      # step P12: the second and third block of [completa] ("none" = no block)
      gruppi2: ${{ steps.matrix.outputs.gruppi2 }}
      gruppi3: ${{ steps.matrix.outputs.gruppi3 }}
      sha: ${{ steps.sha.outputs.sha }}
      round: ${{ steps.matrix.outputs.round }}
    steps:
      - id: sha
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.sha.outputs.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Download the Gradle distribution (retries)
        # the wrapper gives up after one 10 s timeout and the cache is read-only off the default
        # branch; services.gradle.org can be down (504), so the run (not the repo file) downloads
        # the same zip from Gradle's GitHub releases, where services.gradle.org redirects
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's#^distributionUrl=https\\://services\.gradle\.org/distributions/gradle-([0-9.]+)-(all|bin)\.zip#distributionUrl=https\\://github.com/gradle/gradle-distributions/releases/download/v\1/gradle-\1-\2.zip#' "$props"
          sed -i -E 's#^networkTimeout=.*#networkTimeout=60000#' "$props"
          grep -E '^(distributionUrl|networkTimeout)=' "$props"
          for i in 1 2 3 4 5; do
            ./gradlew --no-daemon --version && exit 0
            echo "tentativo $i fallito, nuovo tentativo tra $((i * 20)) s"; sleep $((i * 20))
          done
          exit 1
      - name: Build the autoplay runner
        run: ./gradlew --no-daemon :proplus-autoplay:installDist
      - name: Download the map (triplea-maps/world_war_ii_europe)
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/triplea-maps/world_war_ii_europe.git map-repo
          mkdir -p autoplay-kit
          cp map-repo/map/games/ww2eur40_2nd_edition.xml autoplay-kit/
          cp -r game-app/proplus-autoplay/build/install/proplus-autoplay autoplay-kit/runner
      - name: Games to play
        id: matrix
        env:
          HAS_LLM_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          ROUND: ${{ inputs.round || '12' }}
          PARTITE: ${{ inputs.partite || '7' }}
          SEMI: ${{ inputs.semi || '2' }}
          PIANI: ${{ inputs.piani || '' }}
          # [ripubblica] uses the game list of [completa] (the games come from an earlier run)
          MODALITA: ${{ inputs.modalita == 'ripubblica' && 'completa' || inputs.modalita || 'normale' }}
        run: |
          # the full matrix goes to a file, not to the step outputs (run 44641570445: job outputs > 1 MB)
          python3 - <<'EOF' > matrice.txt
          import json, os, re
          rounds = int(os.environ["ROUND"])
          seeds = max(1, min(4, int(os.environ["SEMI"])))
          default = ["A/1", "A/2", "D/1", "D/2", "C/1", "hard", "B/1"]
          custom = [p.strip() for p in os.environ["PIANI"].split(",") if p.strip()]
          configs = custom or default[: max(1, min(7, int(os.environ["PARTITE"])))]
          if os.environ["MODALITA"] == "confronto":
              # step CONFRONTO: Pro+ (rules or Claude Haiku) on one side against the original Hard on
              # the other, same 4 seeds for every configuration, Hard vs Hard as the reference;
              # the LLM configurations only with the secret (skipped without error)
              llm = os.environ["HAS_LLM_KEY"] == "true"
              confronto = [
                  (1, "Hard-vs-Hard", "Hard vs Hard", "Axis=hard,Allies=hard", "", ""),
                  (2, "Asse-ProPlus-A-vs-Hard", "Asse Pro+ A / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", ""),
                  (3, "Asse-ProPlus-D-vs-Hard", "Asse Pro+ D / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=D", ""),
                  (4, "Hard-vs-Alleati-ProPlus-1", "Asse Hard / Alleati Pro+ 1",
                   "Axis=hard,Allies=proplus", "Allies=1", ""),
                  (5, "Hard-vs-Alleati-ProPlus-2", "Asse Hard / Alleati Pro+ 2",
                   "Axis=hard,Allies=proplus", "Allies=2", ""),
              ] + ([
                  (6, "Asse-Haiku-vs-Hard", "Asse Pro+ Haiku / Alleati Hard",
                   "Axis=proplus,Allies=hard", "Axis=A", "Axis=llm"),
                  (7, "Hard-vs-Alleati-Haiku", "Asse Hard / Alleati Pro+ Haiku",
                   "Axis=hard,Allies=proplus", "Allies=1", "Allies=llm"),
              ] if llm else [])
              include = [{"id": f"{n}-{key}-seme{seed}", "nome": f"{name} (seme {seed})",
                          "tipo": tipo, "piano": piano, "seme": seed, "decisore": decisore}
                         for (n, key, name, tipo, piano, decisore) in confronto
                         for seed in (1, 2, 3, 4)]
              print("matrix=" + json.dumps({"include": include}))
              print(f"round={rounds}")
              raise SystemExit(0)
          if os.environ["MODALITA"] in ("completa", "prova7", "prova9", "prova12", "prova13", "prova14", "provapv1", "ablazionepv1", "provap15"):
              # step PARTITA COMPLETA: games played until the victory (map triggers, held for a
              # complete round), NO key (API cost 0), caps 60 rounds and 120 minutes per game (a game
              # at a cap = "stallo", not an error). Step R6: 5 configurations x 40 seeds 1221-1260 =
              # 200 games, shuffled by seed: a Hard vs Hard, f1 Hard vs Allies strategist with the
              # commitment + "squadra_gibilterra", e2 Axis strategist with the commitment + the siege
              # (operation's share 70) vs Hard, f3 e2's Axis vs f1's Allies, g e2 with the
              # operation's share 80 (--quota-operazione) vs Hard.
              # step R6b-bis: same code as R6c, seeds 1301-1340 = 160 games: e2, h, f3, i.
              # step P1: the USA's task (switch "compiti"), seeds 1341-1380 = 160 games: a Hard vs
              # Hard, p2 Hard vs Allies with the commitment + compiti, e2 Axis with the commitment +
              # the siege (share 70) vs Hard, p1 e2's Axis vs p2's Allies
              # step P2: the alliance level (direction, shared bridgehead, the UK's task), same 4
              # configurations on new seeds 1381-1420 = 160 games
              # step P2-bis: no ban on Hard's transports, e2 and p1 on new seeds 1421-1460 = 80 games
              # (criteria and stop rule fixed beforehand: CLAUDE.md "Step P2-bis"; block p2.p2bis)
              # step P3: the UK's city held and the bridgehead weight (switch "regno_unito_p3"),
              # e2, p1, p3 on new seeds 1461-1500 = 120 games (block p3)
              # step P4: three indications to Hard (switches usa_pronti, norvegia_presto,
              # russia_fronte, independent of compiti), seeds 1501-1540 = 200 games (block p4)
              # step P5: two levers (usa_proporzione; norvegia_presto + norvegia_scorta), e2, r1-r3
              # on new seeds 1541-1580 = 160 games (block p5)
              # step P6: concentrated US landing, Norway with exposed transports, e2, s1-s4 on new
              # seeds 1581-1620 = 200 games (block p6)
              # step P7: no neutrals, the UK's bridgehead, the UK's troops ready; 9 configurations x
              # 120 new seeds 1621-1740 = 1080 games in five groups (block p7); [prova7]: s5, c1, c2
              # x seeds 1621-1625 = 15 games (the short check before the long run)
              # step P9+P10: niente_neutrali confirmed, the UK's concentrated bridge; 7
              # configurations x 120 new seeds 1741-1860 = 840 games in groups of 5 (block p9);
              # [prova9]: d1 x seeds 1741-1745 = 5 games (the short check before the long run)
              # (run 44745693981, commit 4115024: 5/5 green; one target per British turn, all the cargo sent)
              asse = "Asse Stratega con impegno e assedio (quota 70)"
              ax = "Axis=impegno+assedio"
              base = "usa_proporzione+sbarco_concentrato"
              p9 = [
                  ("e2", "Asse-impegno-assedio-vs-Hard", "Alleati Hard", "", True),
                  ("n1", "Asse-assedio-vs-Alleati-niente-neutrali", "niente_neutrali", "niente_neutrali", False),
                  ("s2", "Asse-assedio-vs-Alleati-base", "Base", base, False),
                  ("s5", "Asse-assedio-vs-Alleati-base-niente-neutrali", "Base + niente_neutrali", base + "+niente_neutrali", False),
                  ("c3", "Asse-assedio-vs-Alleati-neutrali-ponte-uk", "Base + niente_neutrali + ponte_uk", base + "+niente_neutrali+ponte_uk", False),
                  ("d1", "Asse-assedio-vs-Alleati-ponte-concentrato", "Base + ponte_concentrato", base + "+ponte_concentrato", False),
                  ("d2", "Asse-assedio-vs-Alleati-neutrali-ponte-concentrato", "Base + niente_neutrali + ponte_concentrato", base + "+niente_neutrali+ponte_concentrato", False),
              ]
              p7 = [
                  ("e2", "Asse-impegno-assedio-vs-Hard", "Alleati Hard", "", True),
                  ("s1", "Asse-assedio-vs-Alleati-usa-proporzione", "usa_proporzione", "usa_proporzione", False),
                  ("s2", "Asse-assedio-vs-Alleati-base", "Base", base, False),
                  ("s5", "Asse-assedio-vs-Alleati-niente-neutrali", "Base + niente_neutrali", base + "+niente_neutrali", False),
                  ("c1", "Asse-assedio-vs-Alleati-ponte-uk", "Base + ponte_uk", base + "+ponte_uk", False),
                  ("c2", "Asse-assedio-vs-Alleati-ponte-pronti", "Base + ponte_uk + ponte_pronti", base + "+ponte_uk+ponte_pronti", False),
                  ("c3", "Asse-assedio-vs-Alleati-neutrali-ponte", "Base + niente_neutrali + ponte_uk", base + "+niente_neutrali+ponte_uk", False),
                  ("c4", "Asse-assedio-vs-Alleati-neutrali-ponte-pronti", "Base + niente_neutrali + ponte_uk + ponte_pronti", base + "+niente_neutrali+ponte_uk+ponte_pronti", False),
                  ("c5", "Asse-assedio-vs-Alleati-c4-norvegia", "c4 + norvegia_presto + norvegia_esposta", base + "+niente_neutrali+ponte_uk+ponte_pronti+norvegia_presto+norvegia_esposta", False),
              ]
              if os.environ["MODALITA"] == "prova7":
                  p7 = [c for c in p7 if c[0] in ("s5", "c1", "c2")]
                  seeds = range(1621, 1626)
              elif os.environ["MODALITA"] == "prova9":
                  p7 = [c for c in p9 if c[0] == "d1"]
                  seeds = range(1741, 1746)
              else:
                  p7 = p9
                  seeds = range(1741, 1861)
              completa = [
                  (n, key, asse + " / " + (label if hard else "Alleati Stratega con " + label),
                   "Axis=stratega,Allies=" + ("hard" if hard else "stratega"),
                   ax if hard else ax + ",Allies=" + allies, "", seeds)
                  for (n, key, label, allies, hard) in p7]
              if os.environ["MODALITA"] == "completa":
                  # step P11: the Axis of Hard (no switch) against the Allies' recommended
                  # combination and its parts; h0 and h3 on seeds 1861-2100 (240), h1 and h2 on
                  # 1861-1980 (120) = 720 games. Order of the jobs by priority (if time runs out):
                  # h0 and h3 on 1861-1980, then h1 and h2, then h0 and h3 on 1981-2100
                  p11 = [
                      ("h0", "Hard-vs-Hard", "Alleati Hard", "", range(1861, 2101)),
                      ("h3", "Hard-vs-Alleati-consigliati", "usa_proporzione + sbarco_concentrato + niente_neutrali", base + "+niente_neutrali", range(1861, 2101)),
                      ("h1", "Hard-vs-Alleati-niente-neutrali", "niente_neutrali", "niente_neutrali", range(1861, 1981)),
                      ("h2", "Hard-vs-Alleati-base", "usa_proporzione + sbarco_concentrato", base, range(1861, 1981)),
                  ]
                  completa = [
                      (n, key, "Asse Hard / " + (label if not allies else "Alleati Stratega con " + label),
                       "Axis=hard,Allies=" + ("stratega" if allies else "hard"),
                       "Allies=" + allies if allies else "", "", ss)
                      for (n, key, label, allies, ss) in p11]
              # step P15: every nation "Pro+ (Europe 1940)" with the two boxes (Allies with 8
              # switches, ponte_alleato included) + the Russian levers of Ukraine in a 2x2 design:
              # 00 none, 10 ucraina_contrattacco, 01 ucraina_presidio, 11 both. [provap15]: seeds
              # 2636-2638 = 12 games, one per job; [completa]: seeds from 2639, 3 per job
              if os.environ["MODALITA"] in ("completa", "provap15"):
                  seeds = range(2636, 2639) if os.environ["MODALITA"] == "provap15" else range(2639, 2739)
                  p15 = {"00": "", "10": "ucraina_contrattacco", "01": "ucraina_presidio",
                         "11": "ucraina_contrattacco+ucraina_presidio"}
                  include = [{"id": f"{c}-europa1940-p15-{c}-seme{seed}",
                              "nome": f"P15 {c} (" + (a.replace("+", " + ") if a else "nessuna leva") + f") (seme {seed})",
                              "tipo": "Axis=europa1940,Allies=europa1940", "piano": "", "seme": seed,
                              "decisore": "", "ablazione": "", "operazione": "", "opllm": "",
                              "stratega": "", "budget": "", "tetto": "70",
                              "spento": "", "regole": "", "acceso": ("Allies=" + a) if a else "",
                              "completa": "si", "quota": "", "caselle": "Allies=si,Axis=si", "blocco": 1}
                             for (c, a) in p15.items()
                             for seed in seeds]
                  include.sort(key=lambda g: (g["seme"], g["id"]))
                  print("matrix=" + json.dumps({"include": include}))
                  print("round=60")
                  raise SystemExit(0)
              # step PV1: every nation "Pro+ (Europe 1940)" with the two boxes (Axis and Allies
              # recommended); base = the recommended Allies (7 switches), pv1 = base + usa_carico +
              # capitale_oltranza + ponte_alleato. [provapv1]: seeds 2472-2475 = 8 games, one per
              # job; [completa]: seeds 2476-2595 = 240 games, 3 per job; [ablazionepv1]: each switch
              # alone (A, B, C) on the first seeds of the long run (3 per job)
              # [provapv1] run 45789911852 (a1b4adb): 8/8 green, 0 errors, levers acting (cargo 55
              # units, capital threatened 17 turns, 41 British loaded / 39 unloaded); B3 fixed after
              if os.environ["MODALITA"] in ("completa", "provapv1", "ablazionepv1"):
                  pv1all = "usa_carico+capitale_oltranza+ponte_alleato"
                  if os.environ["MODALITA"] == "ablazionepv1":
                      confs = [("A", "usa_carico"), ("B", "capitale_oltranza"), ("C", "ponte_alleato")]
                      # 40 seeds: the ablation must end within the step's 8 hours (run after the long run)
                      seeds = range(2476, 2516)
                  else:
                      confs = [("base", ""), ("pv1", pv1all)]
                      seeds = range(2472, 2476) if os.environ["MODALITA"] == "provapv1" else range(2476, 2596)
                  include = [{"id": f"{c}-europa1940-pv1-{c}-seme{seed}",
                              "nome": f"PV1 {c} (" + (a.replace("+", " + ") if a else "Alleati consigliati") + f") (seme {seed})",
                              "tipo": "Axis=europa1940,Allies=europa1940", "piano": "", "seme": seed,
                              "decisore": "", "ablazione": "", "operazione": "", "opllm": "",
                              "stratega": "", "budget": "", "tetto": "70",
                              "spento": "", "regole": "", "acceso": ("Allies=" + a) if a else "",
                              "completa": "si", "quota": "", "caselle": "Allies=si,Axis=si", "blocco": 1}
                             for (c, a) in confs
                             for seed in seeds]
                  include.sort(key=lambda g: (g["seme"], g["id"]))
                  print("matrix=" + json.dumps({"include": include}))
                  print("round=60")
                  raise SystemExit(0)
              # (commit with [prova14] must change a non-.md file: paths-ignore skips empty commits)
              # [prova14] run 45236771609 (d3ee9ac): 20/20, 0 planes of P14 lost, options added 889 air base / 662 carrier
              # step P14: every nation "Pro+ (Europe 1940)" with the two boxes (Axis and Allies
              # recommended, 7 switches with taranto) + aerei_corretti per alliance, 2x2 design:
              # 00 off for both, 10 Axis only, 01 Allies only, 11 both. [completa]: seeds 2352-2471
              # = 480 games in one block (5 games per job); [prova14]: seeds 2347-2351 = 20 games
              if os.environ["MODALITA"] in ("completa", "prova14"):
                  seeds = range(2347, 2352) if os.environ["MODALITA"] == "prova14" else range(2352, 2472)
                  p14 = []
                  for c in ["00", "10", "01", "11"]:
                      acceso = ",".join(([("Axis=aerei_corretti")] if c[0] == "1" else []) + ([("Allies=aerei_corretti")] if c[1] == "1" else []))
                      p14.append((c, "europa1940-aerei-" + c, "P14 " + c + " (aerei_corretti: Asse " + c[0] + ", Alleati " + c[1] + ")", acceso))
                  include = [{"id": f"{n}-{key}-seme{seed}", "nome": f"{name} (seme {seed})",
                              "tipo": "Axis=europa1940,Allies=europa1940", "piano": "", "seme": seed,
                              "decisore": "", "ablazione": "", "operazione": "", "opllm": "",
                              "stratega": "", "budget": "", "tetto": "70",
                              "spento": "", "regole": "", "acceso": acceso, "completa": "si",
                              "quota": "", "caselle": "Allies=si,Axis=si", "blocco": 1}
                             for (n, key, name, acceso) in p14
                             for seed in seeds]
                  include.sort(key=lambda g: (g["seme"], g["id"]))
                  print("matrix=" + json.dumps({"include": include}))
                  print("round=60")
                  raise SystemExit(0)
              # step P13: three levers in a factorial design (digits taranto, fabbriche_tenute,
              # bombardamento_mosca), Axis = impegno + assedio (+ German levers), Allies = the final
              # Allies (+ taranto): 000..111 x 120 new seeds 2221-2340 + r0 (Axis Hard vs final
              # Allies) and r1 (+ taranto) = 1200 games in two blocks (seeds 2221-2280, 2281-2340),
              # partial summary after block 1. [prova13]: each lever alone and 000, seeds 2221-2225
              # (short test: run 45074657393, one round, the long run started right after it)
              if os.environ["MODALITA"] in ("completa", "prova13"):
                  finali = "usa_proporzione+sbarco_concentrato+niente_neutrali+norvegia_presto+norvegia_esposta+ponte_concentrato"
                  if os.environ["MODALITA"] == "prova13":
                      combos, refs, seeds = ["100", "010", "001", "000"], [], range(2221, 2226)
                  else:
                      combos, refs, seeds = ["000", "001", "010", "011", "100", "101", "110", "111"], ["r0", "r1"], range(2221, 2341)
                  p13 = []
                  for c in combos:
